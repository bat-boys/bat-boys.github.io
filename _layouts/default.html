<!doctype html>
<html lang="en" class="markdown-page">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: page.name | default: site.title | remove: '.md' | escape }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
  </head>
  <body class="markdown-page">
    <main class="markdown-content">
      {{ content }}
    </main>
    <script>
      document
        .querySelectorAll(".markdown-content :is(h1, h2, h3, h4, h5, h6)[id]")
        .forEach((heading) => {
          const link = document.createElement("a");
          link.className = "heading-anchor";
          link.href = `#${heading.id}`;
          link.setAttribute("aria-label", `Permalink to ${heading.textContent.trim()}`);
          link.textContent = "¶";
          heading.append(link);
        });
    </script>
  </body>
</html>
